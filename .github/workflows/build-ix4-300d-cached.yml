name: Build OpenWrt Cached Test (Lenovo Iomega ix4-300d)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (leave blank to auto-detect version, e.g. 26.1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-packaging python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - uses: actions/cache@v4
        with:
          path: |
            dl
            .ccache
          key: ix4-ccache-${{ hashFiles('target/linux/mvebu/**') }}
          restore-keys: ix4-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Lenovo Iomega ix4-300d
        run: |
          if [ -f target/linux/mvebu/cortexa9/config-ix4-300d ]; then
            cp target/linux/mvebu/cortexa9/config-ix4-300d .config
          else
            cat << 'EOC' > .config
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_lenovo_ix4-300d=y
          CONFIG_CCACHE=y
CONFIG_PACKAGE_uboot-mvebu-ix4-300d=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_ix4-lcd=y
          CONFIG_PACKAGE_luci-app-ix4-lcd=y
          EOC
          fi
          make defconfig

      - name: Download sources
        run: make -j$(nproc) download

      - name: Compile OpenWrt firmware and U-Boot
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect release files and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find bin/targets/mvebu/cortexa9/ -maxdepth 2 -type f \
            \( -name "*.img" -o -name "*.bin" -o -name "*.kwb" -o -name "*.manifest" \) \
            -exec cp -v {} release-files/ \;
          find bin/packages/ -type f \( -name "*ix4-lcd*.apk" -o -name "*ix4-lcd*.ipk" \) \
            -exec cp -v {} release-files/ \;
          (cd release-files && sha256sum * > SHA256SUMS)
          ls -lh release-files/

      - uses: actions/upload-artifact@v4
        with:
          name: ix4-300d-test-build
          path: release-files/*
