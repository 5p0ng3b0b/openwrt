name: Build & Upload Full Sysupgrade (Lenovo Iomega ix4-300d)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (leave blank to attach to latest release)'
        required: false
        default: ''

jobs:
  build-full:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-packaging python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Full NAS Sysupgrade (Lenovo Iomega ix4-300d)
        run: |
          if test -f target/linux/mvebu/cortexa9/config-ix4-300d-full; then
            cp target/linux/mvebu/cortexa9/config-ix4-300d-full .config
          fi
          printf '%s\n' \
            CONFIG_TARGET_mvebu=y \
            CONFIG_TARGET_mvebu_cortexa9=y \
            CONFIG_TARGET_mvebu_cortexa9_DEVICE_lenovo_ix4-300d=y \
            CONFIG_PACKAGE_luci=y \
            CONFIG_PACKAGE_luci-ssl=y \
            CONFIG_PACKAGE_luci-app-attendedsysupgrade=y \
            CONFIG_PACKAGE_luci-app-acl=y \
            CONFIG_PACKAGE_luci-app-filemanager=y \
            CONFIG_PACKAGE_ix4-lcd=y \
            CONFIG_PACKAGE_luci-app-ix4-lcd=y \
            CONFIG_PACKAGE_luci-app-volume-manager=y \
            CONFIG_PACKAGE_luci-app-ksmbd=y \
            CONFIG_PACKAGE_wsdd2=y \
            CONFIG_PACKAGE_tailscale=y \
            CONFIG_PACKAGE_luci-app-tailscale-community=y \
            CONFIG_PACKAGE_autossh=y \
            CONFIG_PACKAGE_hd-idle=y \
            CONFIG_PACKAGE_luci-app-hd-idle=y \
            CONFIG_PACKAGE_irqbalance=y \
            CONFIG_PACKAGE_luci-app-irqbalance=y \
            CONFIG_PACKAGE_wget-ssl=y \
            CONFIG_PACKAGE_curl=y \
            CONFIG_PACKAGE_htop=y \
            CONFIG_PACKAGE_luci-app-ttyd=y \
            CONFIG_PACKAGE_smartmontools=y \
            CONFIG_PACKAGE_rsync=y \
            CONFIG_PACKAGE_mdadm=y \
            CONFIG_PACKAGE_lvm2=y \
            CONFIG_PACKAGE_cryptsetup=y \
            CONFIG_PACKAGE_open-iscsi=y \
            CONFIG_PACKAGE_tgt=y \
            CONFIG_PACKAGE_kmod-crypto-marvell=y \
            CONFIG_PACKAGE_kmod-usb-storage-uas=y \
            CONFIG_PACKAGE_kmod-nvme=y \
            CONFIG_PACKAGE_nvme-cli=y \
            CONFIG_PACKAGE_kmod-fs-ext4=y \
            CONFIG_PACKAGE_e2fsprogs=y \
            CONFIG_PACKAGE_resize2fs=y \
            CONFIG_PACKAGE_tune2fs=y \
            CONFIG_PACKAGE_kmod-md-raid0=y \
            CONFIG_PACKAGE_kmod-md-raid1=y \
            CONFIG_PACKAGE_kmod-md-raid10=y \
            CONFIG_PACKAGE_kmod-md-raid456=y \
            CONFIG_PACKAGE_usbutils=y \
            CONFIG_PACKAGE_pciutils=y \
            CONFIG_PACKAGE_kmod-fs-btrfs=y \
            CONFIG_PACKAGE_btrfs-progs=y \
            CONFIG_PACKAGE_kmod-fs-f2fs=y \
            CONFIG_PACKAGE_f2fs-tools=y \
            CONFIG_PACKAGE_kmod-fs-ntfs3=y \
            CONFIG_PACKAGE_ntfs-3g=y \
            CONFIG_PACKAGE_ntfs-3g-utils=y \
            CONFIG_PACKAGE_kmod-fs-exfat=y \
            CONFIG_PACKAGE_exfat-mkfs=y \
            CONFIG_PACKAGE_exfat-fsck=y \
            CONFIG_PACKAGE_kmod-fs-vfat=y \
            CONFIG_PACKAGE_dosfstools=y \
            CONFIG_PACKAGE_kmod-fs-xfs=y \
            CONFIG_PACKAGE_xfs-mkfs=y \
            CONFIG_PACKAGE_xfs-fsck=y \
            CONFIG_PACKAGE_swap-utils=y >> .config
          make defconfig

      - name: Download sources
        run: make -j$(nproc) download

      - name: Compile Full Sysupgrade
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect Full Sysupgrade image only
        run: |
          mkdir -p release-files-full
          SRC=$(find bin/targets/mvebu/cortexa9/ -maxdepth 2 -type f -name "*lenovo_ix4-300d-squashfs-sysupgrade.bin" | head -n1)
          test -f "$SRC"
          cp -v "$SRC" release-files-full/openwrt-mvebu-cortexa9-lenovo_ix4-300d-squashfs-sysupgrade-full.bin
          ls -lh release-files-full/

      - name: Upload Full Sysupgrade to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if test -z "$TAG"; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          test -n "$TAG"
          echo "Uploading full sysupgrade asset to release: $TAG"
          gh release upload "$TAG" release-files-full/openwrt-mvebu-cortexa9-lenovo_ix4-300d-squashfs-sysupgrade-full.bin --clobber
