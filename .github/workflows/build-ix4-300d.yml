name: Build & Release OpenWrt (Lenovo Iomega ix4-300d)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (leave blank to auto-detect version, e.g. 26.1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-packaging python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Lenovo Iomega ix4-300d
        run: |
          if [ -f target/linux/mvebu/cortexa9/config-ix4-300d ]; then
            cp target/linux/mvebu/cortexa9/config-ix4-300d .config
          else
            cat << 'EOC' > .config
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_lenovo_ix4-300d=y
          CONFIG_PACKAGE_uboot-mvebu-ix4-300d=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_ix4-lcd=y
          CONFIG_KERNEL_PSTORE=y
          CONFIG_KERNEL_PSTORE_CONSOLE=y
          CONFIG_KERNEL_PSTORE_DEFLATE_COMPRESS=y
          CONFIG_KERNEL_PSTORE_RAM=y
          CONFIG_PACKAGE_luci-app-ix4-lcd=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_mdadm=y
          CONFIG_PACKAGE_smartmontools=y
          CONFIG_PACKAGE_hd-idle=y
          CONFIG_PACKAGE_luci-app-hd-idle=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_btrfs-progs=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_exfat-mkfs=y
          CONFIG_PACKAGE_exfat-fsck=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_wsdd2=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          EOC
          fi
          printf '%s\n' \
            CONFIG_PACKAGE_ix4-lcd=y \
            CONFIG_KERNEL_PSTORE=y \
            CONFIG_KERNEL_PSTORE_CONSOLE=y \
            CONFIG_KERNEL_PSTORE_DEFLATE_COMPRESS=y \
            CONFIG_KERNEL_PSTORE_RAM=y \
            CONFIG_PACKAGE_luci-app-ix4-lcd=y \
            CONFIG_PACKAGE_luci-app-volume-manager=y \
            CONFIG_PACKAGE_luci-app-attendedsysupgrade=y \
            CONFIG_PACKAGE_kmod-crypto-marvell=m \
            CONFIG_PACKAGE_kmod-fs-ntfs3=m \
            CONFIG_PACKAGE_kmod-usb-storage-uas=m \
            CONFIG_PACKAGE_kmod-nvme=m \
            CONFIG_PACKAGE_kmod-fs-xfs=m \
            CONFIG_PACKAGE_kmod-fs-exfat=m \
            CONFIG_PACKAGE_kmod-fs-vfat=m \
            CONFIG_PACKAGE_kmod-fs-f2fs=m \
            CONFIG_PACKAGE_kmod-fs-ext4=m \
            CONFIG_PACKAGE_kmod-fs-nfsd=m \
            CONFIG_PACKAGE_kmod-fs-nfs=m \
            CONFIG_PACKAGE_kmod-fs-nfs-v4=m \
            CONFIG_PACKAGE_kmod-fs-cifs=m \
            CONFIG_PACKAGE_kmod-usb-storage-uas=m \
            CONFIG_PACKAGE_kmod-usb-storage-extras=m \
            CONFIG_PACKAGE_kmod-loop=m \
            CONFIG_PACKAGE_btrfs-progs=m \
            CONFIG_PACKAGE_ntfs-3g=m \
            CONFIG_PACKAGE_mdadm=m \
            CONFIG_PACKAGE_lvm2=m \
            CONFIG_PACKAGE_cryptsetup=m \
            CONFIG_PACKAGE_open-iscsi=m \
            CONFIG_PACKAGE_tgt=m >> .config
          make defconfig

      - name: Download sources
        run: make -j$(nproc) download

      - name: Compile OpenWrt firmware and U-Boot
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect release files and generate SHA256SUMS
        run: |
          mkdir -p release-files uboot-stage kernel-stage
          find build_dir/ -path '*u-boot-ix4-300d*/u-boot.bin' -exec cp -v {} uboot-stage/ \;
          find bin/targets/mvebu/cortexa9/ -maxdepth 2 -type f -name "*.kwb" -exec cp -v {} uboot-stage/ \;
          find build_dir/target-* -path '*u-boot-ix4-300d/u-boot-*/arch/arm/dts/armada-xp-lenovo-ix4-300d.dts' -exec cp -v {} uboot-stage/u-boot-armada-xp-lenovo-ix4-300d.dts \;
          find build_dir/target-* -path '*u-boot-ix4-300d/u-boot-*/arch/arm/dts/armada-xp-lenovo-ix4-300d.dtb' -exec cp -v {} uboot-stage/u-boot-armada-xp-lenovo-ix4-300d.dtb \;
          find build_dir/target-* -path '*u-boot-ix4-300d/u-boot-*/.config' -exec cp -v {} uboot-stage/u-boot-ix4-300d.config \;
          printf '%s\n' 'U-Boot 2026.10 for Lenovo Iomega ix4-300d' 'RAM Test (Marvell>>): tftpboot 0x00800000 u-boot.bin && go 0x00800000' 'NAND Flash (Marvell>>): tftpboot 0x02000000 u-boot-with-spl.kwb && nand erase 0x0 0xe0000 && nand write 0x02000000 0x0 $filesize && reset' > uboot-stage/README-UBOOT.txt
          python3 -c "import shutil; shutil.make_archive('release-files/uboot26.10', 'zip', 'uboot-stage')"
          KDIR=$(find build_dir/target-* -maxdepth 2 -type d -name 'linux-6*' -o -name 'linux-7*' | head -n1)
          KVER=$(basename "$KDIR" | cut -d- -f2 | cut -d. -f1,2)
          KVER="${KVER:-6.18}"
          find build_dir/target-* -path '*linux-mvebu_cortexa9/linux-*/arch/arm/boot/dts/marvell/armada-xp-lenovo-ix4-300d.dts' -exec cp -v {} kernel-stage/armada-xp-lenovo-ix4-300d.dts \;
          find build_dir/target-* -path '*linux-mvebu_cortexa9/lenovo_ix4-300d-kernel.bin' -exec cp -v {} kernel-stage/kernel.bin \;
          find build_dir/target-* -path '*linux-mvebu_cortexa9/zImage' -exec cp -v {} kernel-stage/zImage \;
          find build_dir/target-* -path '*linux-mvebu_cortexa9/linux-*/arch/arm/boot/dts/marvell/armada-xp-lenovo-ix4-300d.dtb' -exec cp -v {} kernel-stage/armada-xp-lenovo-ix4-300d.dtb \;
          find build_dir/target-* -path '*linux-mvebu_cortexa9/linux-*/.config' -exec cp -v {} kernel-stage/kernel-ix4-300d.config \;
          printf '%s\n' "Linux ${KVER} Kernel Bundle for Lenovo Iomega ix4-300d" "kernel.bin : zImage + appended armada-xp-lenovo-ix4-300d.dtb (no initramfs)" "zImage     : raw compressed ARM kernel (no initramfs, no appended DTB)" > kernel-stage/README-KERNEL.txt
          python3 -c "import shutil; shutil.make_archive('release-files/kernel-${KVER}', 'zip', 'kernel-stage')"
          find bin/targets/mvebu/cortexa9/ -maxdepth 2 -type f \
            \( -name "*.img" -o -name "*.bin" \) \
            -exec cp -v {} release-files/ \;
          for f in release-files/*mvebu-cortexa9-lenovo_*; do
            test -f "$f" && mv -v "$f" "${f/mvebu-cortexa9-lenovo_/}"
          done
          find bin/packages/ -type f -name "ix4-lcd-*.apk" -exec cp -v {} release-files/ix4-lcd.apk \;
          find bin/packages/ -type f -name "luci-app-ix4-lcd-*.apk" -exec cp -v {} release-files/luci-app-ix4-lcd.apk \;
          find bin/packages/ -type f -name "luci-app-volume-manager-*.apk" -exec cp -v {} release-files/luci-app-volume-manager.apk \;
          (cd release-files && sha256sum * > SHA256SUMS)
          ls -lh release-files/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            TAG="${TAG#v}"
          else
            IMG=$(ls release-files/openwrt_*_lenovo_ix4-300d_factory.img 2>/dev/null | head -n1 || true)
            VER=$(basename "$IMG" | sed -n 's/^openwrt_\([^_]*\)_lenovo_ix4-300d_factory\.img$/\1/p')
            VER="${VER#v}"
            TAG="${VER:-26.1}"
          fi
          echo "Release tag: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prune stale APK and legacy assets on existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true); do
            case "$old" in
              ix4-lcd-*.apk|luci-app-ix4-lcd-*.apk|luci-app-volume-manager-*.apk|*mvebu-cortexa9-lenovo_*|*.manifest)
                gh release delete-asset "$TAG" "$old" --yes || true
                ;;
            esac
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OpenWrt Lenovo Iomega ix4-300d (${{ steps.tag.outputs.name }})
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release-files/*
          body_path: .github/release-notes.md
