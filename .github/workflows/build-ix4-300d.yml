name: Build & Release OpenWrt (Lenovo Iomega ix4-300d)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (leave blank to auto-detect version, e.g. 26.1)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-packaging python3-setuptools rsync swig unzip zlib1g-dev \
            file wget qemu-utils

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Lenovo Iomega ix4-300d
        run: |
          if [ -f target/linux/mvebu/cortexa9/config-ix4-300d ]; then
            cp target/linux/mvebu/cortexa9/config-ix4-300d .config
          else
            cat << 'EOC' > .config
          CONFIG_TARGET_mvebu=y
          CONFIG_TARGET_mvebu_cortexa9=y
          CONFIG_TARGET_mvebu_cortexa9_DEVICE_lenovo_ix4-300d=y
          CONFIG_PACKAGE_uboot-mvebu-ix4-300d=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_ix4-lcd=y
          CONFIG_PACKAGE_luci-app-ix4-lcd=y
          CONFIG_PACKAGE_luci-app-mini-diskmanager=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_mdadm=y
          CONFIG_PACKAGE_smartmontools=y
          CONFIG_PACKAGE_hd-idle=y
          CONFIG_PACKAGE_luci-app-hd-idle=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-f2fs=y
          CONFIG_PACKAGE_f2fs-tools=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_btrfs-progs=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_exfat-mkfs=y
          CONFIG_PACKAGE_exfat-fsck=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_ntfs-3g=y
          CONFIG_PACKAGE_ksmbd-server=y
          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_wsdd2=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_curl=y
          EOC
          fi
          printf '%s\n' \
            CONFIG_PACKAGE_ix4-lcd=y \
            CONFIG_PACKAGE_luci-app-ix4-lcd=y \
            CONFIG_PACKAGE_luci-app-volume-manager=y \
            CONFIG_ALL_KMODS=y \
            CONFIG_PACKAGE_kmod-crypto-marvell=m \
            CONFIG_PACKAGE_kmod-fs-ntfs3=m \
            CONFIG_PACKAGE_kmod-fs-xfs=m \
            CONFIG_PACKAGE_kmod-fs-exfat=m \
            CONFIG_PACKAGE_kmod-fs-vfat=m \
            CONFIG_PACKAGE_kmod-fs-f2fs=m \
            CONFIG_PACKAGE_kmod-fs-ext4=m \
            CONFIG_PACKAGE_kmod-fs-nfsd=m \
            CONFIG_PACKAGE_kmod-fs-nfs=m \
            CONFIG_PACKAGE_kmod-fs-nfs-v4=m \
            CONFIG_PACKAGE_kmod-fs-cifs=m \
            CONFIG_PACKAGE_kmod-usb-storage-uas=m \
            CONFIG_PACKAGE_kmod-usb-storage-extras=m \
            CONFIG_PACKAGE_kmod-loop=m \
            CONFIG_PACKAGE_btrfs-progs=m \
            CONFIG_PACKAGE_ntfs-3g=m \
            CONFIG_PACKAGE_mdadm=m \
            CONFIG_PACKAGE_lvm2=m \
            CONFIG_PACKAGE_cryptsetup=m \
            CONFIG_PACKAGE_open-iscsi=m \
            CONFIG_PACKAGE_tgt=m >> .config
          make defconfig

      - name: Download sources
        run: make -j$(nproc) download

      - name: Compile OpenWrt firmware and U-Boot
        run: make -j$(nproc) || make -j1 V=s

      - name: Collect release files and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find build_dir/ -path '*u-boot-ix4-300d*/u-boot.bin' -exec cp -v {} release-files/ \;
          find bin/targets/mvebu/cortexa9/ -maxdepth 2 -type f \
            \( -name "*.img" -o -name "*.bin" -o -name "*.kwb" -o -name "*.manifest" \) \
            -exec cp -v {} release-files/ \;
          find bin/packages/ -type f \( -name "*ix4-lcd*.apk" -o -name "*mini-diskmanager*.apk" -o -name "*volume-manager*.apk" -o -name "*ix4-lcd*.ipk" \) \
            -exec cp -v {} release-files/ \;
          (cd release-files && sha256sum * > SHA256SUMS)
          ls -lh release-files/

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
            TAG="${TAG#v}"
          else
            IMG=$(ls release-files/openwrt_*_lenovo_ix4-300d_factory.img 2>/dev/null | head -n1 || true)
            VER=$(basename "$IMG" | sed -n 's/^openwrt_\([^_]*\)_lenovo_ix4-300d_factory\.img$/\1/p')
            VER="${VER#v}"
            TAG="${VER:-26.1}"
          fi
          echo "Release tag: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: OpenWrt Lenovo Iomega ix4-300d (${{ steps.tag.outputs.name }})
          generate_release_notes: true
          make_latest: true
          files: release-files/*
          body_path: .github/release-notes.md
